group 'dev.codecore'
version '0.3.0'

apply plugin: 'com.android.library'

android {
    namespace 'dev.codecore.codecore'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        minSdk 24
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
