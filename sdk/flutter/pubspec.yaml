name: codecore
description: Dart SDK for CodeCore, an embeddable code editor engine.
version: 0.5.0
publish_to: none

environment:
  sdk: ^3.6.0

# CodeCore deliberately has no Dart package dependencies. Native memory is
# allocated through the C ABI (cc_alloc/cc_free), so callers do not need
# package:ffi. The Android plugin builds and packages libcodecore.so.
flutter:
  plugin:
    platforms:
      android:
        package: dev.codecore.codecore
        pluginClass: CodeCorePlugin
